<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kelmscott letters</title>
<!--
  Every initial kit/styles/kelmscott.js has traced (research/16-kelmscott.md), each letter as a drop six lines deep (the
  white-vine block, else the two-line one) and two lines deep (the two-line block, else the white-vine one); J and U take I's and V's
  blocks, as the Chaucer sets them; each is captioned Morris's or composed by us (tools/kgraft.py: grafted from pieces of his own
  white-vine blocks).
  fonts fetched per letter. ?draw, ?theme=light|dark, ?cut=positive|negative, ?nocap (the captions hidden: a blind test).
-->
<style>
  @font-face { font-family: "EB Garamond"; src: url(../fonts/EBGaramond-normal.woff2) format("woff2"); font-weight: 400 600; font-style: normal; font-display: block; }
  :root { --paper: rgb(244 238 226); --ink: #2b2119; --rubric: rgb(184 54 40); color-scheme: light; }
  :root[data-theme=dark] { --paper: rgb(28 25 22); --ink: rgb(222 212 196); --rubric: rgb(222 120 92); color-scheme: dark; }
  html { background: var(--paper); }
  body { margin: 0; color: var(--ink); font: 400 20px/1.6 "EB Garamond", Garamond, serif; }
  .sheet { position: relative; max-width: 1200px; margin: 0 auto; padding: 60px 40px; box-sizing: border-box; }
  .sheet > canvas { position: absolute; left: 0; top: 0; pointer-events: none; }
  .text { position: relative; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 24px 40px; }
  .text p { margin: 0; text-align: justify; hyphens: auto; }
  .cap { display: block; font-size: 12px; font-style: italic; opacity: .7; margin-bottom: 4px; }
  .ini { color: transparent; }
  .ini.drop { float: left; line-height: 1; }
  .ini.line { display: inline-block; font-size: 1.8em; line-height: 0; margin-right: .12em; }
</style>
</head>
<body>
<main class="sheet"><div class="text"></div></main>
<script type="module">
import { rubricate } from '../kit/illum.js';
import { STYLES } from '../kit/wayfinding.js';
import kelmscott from '../kit/styles/kelmscott.js';
STYLES.kelmscott = kelmscott;
const q = new URLSearchParams(location.search);
document.documentElement.dataset.theme = q.get('theme') === 'dark' || (!q.get('theme') && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
kelmscott.darkCut = q.get('cut') ?? 'positive';
kelmscott.caps = q.get('caps') ?? 'gen';   // the six-line letters Morris never cut: generated from his blocks (gen), grown in the gaps (gen2), grown (grow) or grafted (graft)
if (q.has('nocap')) document.head.append(Object.assign(document.createElement('style'), { textContent: '.cap { visibility: hidden }' }));   // (an unlabelled test)
const words = 'ut our higher instincts are not deceived. We take no pleasure in the building provided for us, resembling that which we take in a new book or a new picture.';
const text = document.querySelector('.text');
const G = kelmscott.GLYPHS, who = k => !G[k] ? null : G[k].gen ? 'generated by us' : G[k].m ? 'grafted by us' : 'Morris';
for (const ch of 'ABCDEFGHIJKLMNOPQRSTUVWXYZ') for (const [cls, n] of [['drop', 6], ['drop', 2]]) { const p = document.createElement('p');
  // (the caption: whose block it is; a letter with no block of its own in a series takes the other's, J and U take I's and V's)
  const c = { J: 'I', U: 'V' }[ch] ?? ch, cp = q.get('caps') ?? 'gen', gp = { gen: 'n', gen2: 'w' }[cp], v = gp && G[gp + ch] ? gp + ch : cp === 'grow' && G['g' + c] ? 'g' + c : 'v' + c, sm = 's' + c, k = n === 6 ? (G[v] ? v : sm) : (G[sm] ? sm : v);
  p.innerHTML = `<small class="cap">${ch}${c !== ch ? ' (set as ' + c + ')' : ''} · ${n === 6 ? 'white-vine' : 'two-line'}${k[0] === (n === 6 ? 's' : 'v') && n !== 6 || (n === 6 && k[0] === 's') ? ' (the other series’ block)' : ''} · ${who(k) ?? 'red capital'}</small><span class="ini ${cls}" data-lines="${n}">${ch}</span>${words}`; text.append(p); }
rubricate(text, { style: 'kelmscott', draw: q.has('draw') ? 'read' : 'still', select: { paraph: 'none', filler: 'none' },
  on: (state, t) => { document.body.dataset.timing = t ? `in view ${t.view} ms, all ${t.all} ms` : state === 'written' ? 'drawn' : state; } });
</script>
<script type="module" src="../kit/theme-toggle.js"></script>
</body>
</html>
