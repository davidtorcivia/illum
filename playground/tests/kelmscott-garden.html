<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kelmscott garden</title>
<!-- kit/styles/kelmscott-garden.js: each letter's garden block beside the ?caps=gen2 block (kgap.py's font).
  ?l=RJEO (letters) &h=170 (block height, px) &seed=1 &theme=light|dark &gen2=0 (hide the comparison) -->
<style>
  :root { --paper: rgb(244 238 226); --ink: #2b2119; }
  :root[data-theme=dark] { --paper: rgb(28 25 22); --ink: rgb(222 212 196); }
  html { background: var(--paper); } body { margin: 0; padding: 24px; color: var(--ink); font: 13px/1.4 serif; }
  .row { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start; }
  figure { margin: 0; } figcaption { font-style: italic; opacity: .7; }
</style>
</head>
<body><div class="row"></div>
<script type="module">
import { loadLetter, garden, drawGarden, A, bandOf } from '../kit/styles/kelmscott-garden.js';
import kelmscott from '../kit/styles/kelmscott.js';
const q = new URLSearchParams(location.search), dark = q.get('theme') === 'dark';
document.documentElement.dataset.theme = dark ? 'dark' : 'light';
const letters = q.get('l') ?? 'RJEO', H = +(q.get('h') ?? 170), seed = +(q.get('seed') ?? 1), dpr = devicePixelRatio, row = document.querySelector('.row');
const ink = dark ? [226, 216, 198] : [38, 31, 27], paper = dark ? [28, 25, 22] : [244, 238, 226];
// a block's coverage (alpha = ink) shown as the style prints it: light, the black in ink; dark (positive), the white in pale ink
function show(drawInk, label) {
  const w = Math.ceil(A * H), cv = document.createElement('canvas'); cv.width = w * dpr; cv.height = H * dpr; cv.style.width = w + 'px'; cv.style.height = H + 'px';
  const o = new OffscreenCanvas(cv.width, cv.height), g = o.getContext('2d'); g.scale(dpr, dpr); drawInk(g);
  const c = cv.getContext('2d');
  if (!dark) { c.drawImage(o, 0, 0); c.globalCompositeOperation = 'source-in'; c.fillStyle = `rgb(${ink})`; c.fillRect(0, 0, cv.width, cv.height); }
  else { c.fillStyle = `rgb(${ink})`; c.fillRect(1.5 * dpr, 1.5 * dpr, cv.width - 3 * dpr, cv.height - 3 * dpr); c.globalCompositeOperation = 'destination-out'; c.drawImage(o, 0, 0); }
  const f = document.createElement('figure'); f.append(cv, Object.assign(document.createElement('figcaption'), { textContent: label })); row.append(f);
}
const t = [];
for (const ch of letters) {
  await loadLetter(ch);
  const t0 = performance.now(), geo = garden(ch, seed, bandOf(H * dpr)), t1 = performance.now();
  show(g => drawGarden(g, geo, 0, 0, H, dpr), `${ch} garden (${(t1 - t0).toFixed(1)} ms)`); t.push(t1 - t0);
  if (q.get('gen2') !== '0') { const k = 'w' + ch; await kelmscott.loadGlyph(k); show(g => { g.font = `${H}px "kelmscott-${k}"`; g.fillText(kelmscott.GLYPHS[k].c, 0, H); }, `${ch} gen2`); }
}
document.body.dataset.timing = t.map(v => v.toFixed(1)).join(' ');
</script>
</body>
</html>
