<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Copperplate directions</title>
<!--
  Copperplate, direction studies, stage 2 (research/23-copperplate.md): B the writing master's pen, C command of hand (A, the
  plate, dropped at the user's verdict). Both draw the same movements (kit/styles/copperplate-hand.js).
  Each: a drop initial, a paraph, a line-filler, a break and a quotation's head at page size in light and dark, then
  enlarged, and the master beside ours. Drawn live as vector (tests/copperplate-directions.js) and printed through the ink
  engine (kit/styles/copperplate-print.js).   ?only=pen|hand  ?letters=BLRS  ?draw (written as each panel comes into
  view)  #seed=n
-->
<style>
  @font-face { font-family: "EB Garamond"; src: url(../fonts/EBGaramond-normal.woff2) format("woff2"); font-weight: 400 600; font-style: normal; font-display: block; }
  @font-face { font-family: "EB Garamond"; src: url(../fonts/EBGaramond-italic.woff2) format("woff2"); font-weight: 400; font-style: italic; font-display: block; }
  html { background: rgb(236 231 220); }
  body { margin: 0; font: 400 20px/1.6 "EB Garamond", Garamond, serif; color: #2b2119; -webkit-font-smoothing: antialiased; }
  header { max-width: 1320px; margin: 0 auto; padding: 40px 24px 0; }
  header h1 { font-weight: 500; font-size: 1em; letter-spacing: .14em; text-transform: uppercase; margin: 0; }
  header p { font-style: italic; margin: .2em 0 0; font-size: .9em; }
  header nav a { color: inherit; margin-right: 1em; font-size: .9em; }
  section.dir { max-width: 1320px; margin: 0 auto; padding: 36px 24px 12px; }
  section.dir > h2 { font-weight: 500; font-size: 1em; letter-spacing: .1em; text-transform: uppercase; margin: 0 0 .2em; }
  section.dir > p.note { margin: 0 0 1em; font-style: italic; font-size: .9em; max-width: 56em; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .panel { position: relative; padding: 44px 44px 40px 56px; background: var(--paper); color: var(--ink); overflow: hidden; }
  [data-theme=light] { --paper: rgb(244 238 226); --ink: #2b2119; }
  [data-theme=dark] { --paper: rgb(24 22 20); --ink: rgb(222 212 196); }
  .panel .text { position: relative; hyphens: auto; text-align: justify; max-width: 560px; }
  .panel p { margin: 0; } .panel p.par { text-indent: 0; margin-top: .5em; }
  .panel .pf { display: inline-block; }
  .panel hr { border: 0; height: 3.4em; margin: .4em 0; }
  .panel blockquote { margin: 1em 0 0; padding: 1.3em 0 0 2.4em; font-style: italic; }
  .ini { float: left; color: transparent; }
  .zoom { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 16px; align-items: flex-start; }
  .zoom figure { margin: 0; background: var(--paper); padding: 16px; max-width: 100%; box-sizing: border-box; }
  .zoom figcaption { font: italic 13px/1.3 "EB Garamond", serif; color: var(--ink); opacity: .75; margin-top: 6px; max-width: 46em; }
  .zoom canvas, .zoom img { display: block; max-width: 100%; height: auto; }
  .refs { display: flex; gap: 12px; flex-wrap: wrap; width: 100%; }
  .refs figure { margin: 0; padding: 0; background: none; }
  .refs img { height: 260px; width: auto; object-fit: contain; }
  .side { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
  @media (max-width: 900px) {
    body { font-size: 18px; line-height: 1.55; }
    .pair { grid-template-columns: 1fr; }
    .panel { padding: 32px 20px 28px 20px; }
    .panel .text { text-align: left; }
    section.dir { padding: 28px 0 8px; } header, section.dir > h2, section.dir > p.note { padding-left: 16px; padding-right: 16px; }
    .refs img { height: 150px; }
  }
</style>
</head>
<body>
<header><h1>Copperplate · two directions</h1><p>Each: a drop initial, a paraph, a line-filler, a break and a quotation’s head at page size, light and dark; then enlarged; then the master beside ours. Seed <span id="seed"></span>. <span id="timing"></span></p>
<nav><a href="?only=pen">B · the pen</a><a href="?only=hand">C · command of hand</a><a href="?">both</a><a href="?draw">both, written</a></nav></header>
<template id="txt">
  <p><span class="ini">B</span>ut our higher instincts are not deceived. We take no pleasure in the building provided for us, resembling that which we take in a new book or a new picture. We may be proud of its size, complacent in its correctness, and happy in its convenience.</p>
  <p class="par fill"><span class="pf"></span>Yet all this is true, and self-evident; only hidden from us, as many other self-evident things are, by false teaching. Nothing is a great work of art for which rules can be given.</p>
  <hr>
  <p>A book had no page numbers, no index and no search. Its readers found their way by its ornament: every mark said where you were.</p>
  <blockquote>Ornament is the mark of a hand that took its time.</blockquote>
</template>
<main id="out"></main>
<script type="module">
import { DIRS, PAL, B_OPTS } from './copperplate-directions.js';
import { coverage, glyph, thinShades, thinShadesFine, engrave, quill, engraveWriter, quillWriter, glyphStrokes, poolMap } from '../kit/styles/copperplate-print.js';
import { inkLetter, letterWriter } from '../kit/inkletter.js';
const q = new URLSearchParams(location.search), seed = +(location.hash.match(/seed=(\d+)/)?.[1] ?? 7);
for (const k of ['geo', 'wet', 'rough', 'rim']) if (q.has(k)) B_OPTS[k] = +q.get(k); for (const k of ['letter', 'line']) if (q.has(k)) B_OPTS[k] = q.get(k);
document.getElementById('seed').textContent = seed;
// ?draw: each panel written as it comes into view (never under reduced motion)
const DRAW = q.has('draw') && !matchMedia('(prefers-reduced-motion: reduce)').matches;
// the letters (fonts/copperplate/): Pinyon Script for the hand, Imperial Script for the pen, cut to A-Z
// (C's capital: Bickham's rosettes hold a heavy text letter; UnifrakturMaguntia, unmodified, from fonts/, its OFL beside it)
await Promise.all([['CopperA', 'copperplate/illum-copper-pinyon-caps.woff2'], ['CopperB', 'copperplate/illum-copper-imperial-caps.woff2'], ['CopperC', 'UnifrakturMaguntia-Book.woff2']].map(async ([fam, f]) => { const ff = new FontFace(fam, `url(../fonts/${f})`); await ff.load(); document.fonts.add(ff); }));
await document.fonts.load('20px "EB Garamond"');
const letters = (q.get('letters') ?? 'BLRS').split(''), dpr = Math.min(2, devicePixelRatio || 1), PAD = 6, t0 = performance.now();
const NOTES = {
  pen: 'The writing master’s own pen: one great oval on the slant round the capital, entered as a hairline from below left and run once round and a little more, a curl or two inside; the copybook’s oval for the paraph, a compound curve into a small oval for the filler and the break, a rule into an oval at the quotation’s corner. Written with a flexible pointed quill in iron-gall ink through the ink engine: the nib opens only where the hand pulls down the slant and builds and releases its pressure (fitted to Bickham’s own oval), the ink pooling where the hand slows. The capital from Imperial Script.',
  hand: 'Command of hand, after Bickham (the ABC headpiece, 0414; the dove, 0220; the WIT bands, 0124): round a heavy text capital six ovals of different sizes, the larger turning a second oval inside themselves, the ring entered by a short sweep and left by a tail into a curl; dot-curls and thorns in the gaps. Loop chains riding a sweep for the paraph, filler and break; a knot at the quotation’s corner. Every stroke’s weight is the engraver’s pen: each oval swells on both sides of its turn (the far side lighter), never a constant line. Cut as engraved strokes. In the dark, an ivory ink.',
};
const REFS = {
  pen: [['forbes-lion-detail.jpg', 'H. E. Forbes, Ornamental Lion Composed of Scrolls, pen and ink, Met 363599 (CC0): the pen’s shade, its pooling and pale hairlines'], ['bickham-dove.jpg', 'Bickham, a dove in command of hand (Universal Penman, Getty via IA, not in copyright)']],
  hand: [['bickham-abc-rosettes.jpg', 'Bickham, the ABC headpiece: capitals in overlapping ovals (Universal Penman p. 209)'], ['bickham-dove.jpg', 'a dove in command of hand: chains of loops riding shaded sweeps'], ['bickham-band.jpg', 'John Bickham sculp., the foot of WIT (p. 46): a band of sweeps and long ovals']],
};
// the master beside ours: [what, the master's crop, the piece]
const SIDES_OF = { hand: [['drop', 'bickham-rosette-B.jpg'], ['filler', 'bickham-dove-wing.jpg'], ['break', 'bickham-band.jpg']],
  pen: [['drop', 'champion-B.jpg'], ['drop', 'forbes-lion-detail.jpg']] };
// a piece printed onto its own canvas, PAD px of margin round it, at zoom; the piece made for that zoom (its hairline floor).
// live (?draw): the canvas comes back empty in a wrapper, with the piece's writers in the order the hand made it (the
// capital first, written along its skeleton; then the flourish, cut or written along its path at the hand's pace)
function printed(key, theme, make, zoom = 1, live = false) {
  const d = dpr * zoom, piece = make(d), { W, H } = piece, cv = document.createElement('canvas'), rgb = PAL[key][theme];
  cv.width = Math.ceil((W + PAD * 2) * d); cv.height = Math.ceil((H + PAD * 2) * d); cv.style.width = (W + PAD * 2) * zoom + 'px'; cv.style.height = (H + PAD * 2) * zoom + 'px';
  const g = cv.getContext('2d'), box = [0, 0, W + PAD * 2, H + PAD * 2], res = Math.max(2, d * 1.25);
  const strokes = piece.strokes.map(s => ({ p: s.p.map(([x, y]) => [x + PAD, y + PAD]), w: s.w, t: s.t, balls: s.balls.map(([[x, y], r]) => [[x + PAD, y + PAD], r]) }));
  let Lm = null;
  // (fine: the cut worked finer than the grid and closed back over the letter's body, so its edges stay smooth and its joins
  // whole up close; C's text capital, stage 6)
  if (piece.letter) { const { ch, face, cap, cx, cy, thin = .3, fine = false } = piece.letter, draw = glyph(ch, face, cap, cx + PAD, cy + PAD);
    Lm = fine ? thinShadesFine(draw, box, res, thin, res * .9, 2) : thin ? thinShades(coverage([], box, res, draw), thin, res * .9) : coverage([], box, res, draw); }
  if (live) {
    const el = document.createElement('div'); el.style.position = 'absolute'; cv.style.display = 'block'; el.append(cv); const writers = [];
    const lw = (L, o) => { const w = letterWriter(g, L, { k: rgb }, { dpr: d, host: el, ...o }); return { dur: 1300, at: f => w.at(f), done: () => w.done() }; };
    if (piece.medium === 'ink') {   // (B, laid crisp: the capital cut along its skeleton's order, then each stroke at the hand's pace, the pools where it slowed)
      // (the pen's order: the strokes before the capital, the capital along its skeleton, the strokes after it)
      const n = piece.letterAfter ?? 0, rgb2 = PAL[key].pool[theme], part = ss => { if (!ss.length) return; const M = coverage(ss, box, res); writers.push(engraveWriter(g, M, ss, rgb, { dpr: d, flat: true, tint: poolMap(ss, M), rgb2 })); };
      part(strokes.slice(0, n));
      if (Lm) { letterWriter(g, Lm, { k: rgb }, { dpr: d, host: el }); writers.push(engraveWriter(g, Lm, [], rgb, { dpr: d, flat: true, cellT: Lm.order.T, dur: 1300 })); }
      part(strokes.slice(n)); return { el, writers }; }
    if (piece.medium === 'engrave') { if (Lm && !piece.flat) writers.push(lw({ ...Lm }, { wet: .03, dry: .04 }));
      // (laid flat: the capital is cut first, along its skeleton's order, as the same reveal)
      if (Lm && piece.flat) { letterWriter(g, Lm, { k: rgb }, { dpr: d, host: el }); writers.push(engraveWriter(g, Lm, [], rgb, { dpr: d, flat: true, cellT: Lm.order.T, dur: 1300 })); }   // (letterWriter made only for its skeleton order, Lm.order)
      writers.push(engraveWriter(g, coverage(strokes, box, res), strokes, rgb, { dpr: d, flat: piece.flat })); }
    else { const ls = Lm && piece.letter.pen ? glyphStrokes(Lm) : []; if (Lm && !ls.length) writers.push(lw({ ...Lm }, { wet: .1, dry: .2 })); writers.push(quillWriter(g, ls.concat(strokes), rgb, { dpr: d, box, seed, host: el, ...piece.ink })); }
    return { el, writers };
  }
  if (piece.medium === 'ink') { const M = coverage(strokes, box, res), tint = poolMap(strokes, M); if (Lm) for (let i = 0; i < M.M.length; i++) M.M[i] = Math.max(M.M[i], Lm.M[i]); engrave(g, M, rgb, { dpr: d, flat: true, tint, rgb2: PAL[key].pool[theme] }); return cv; }
  if (piece.medium === 'engrave') { const M = coverage(strokes, box, res); if (Lm) for (let i = 0; i < M.M.length; i++) M.M[i] = Math.max(M.M[i], Lm.M[i]); engrave(g, M, rgb, { dpr: d, flat: piece.flat }); }
  else { const ls = Lm && piece.letter.pen ? glyphStrokes(Lm) : []; if (Lm && !ls.length) inkLetter(g, { ...Lm, wet: .1, dry: .2 }, rgb, { dpr: d }); quill(g, ls.concat(strokes), rgb, { dpr: d, box, seed, ...piece.ink }); }
  return cv;
}
// the score: one hand for the page. A panel's writers join the queue when it comes into view (panels seen together in
// reading order), and a single runner writes them one after another at the hand's pace: the ink media are shared, so two
// pieces are never written at once
const queue = []; let running = false, st = 0;
function run(now) { const w = queue[0]; if (!w) { running = false; return; } if (!st) st = now; const f = (now - st) / Math.max(1, w.dur);
  if (f >= 1) { w.done(); queue.shift(); st = 0; } else w.at(f); requestAnimationFrame(run); }
const seen = new IntersectionObserver(es => { for (const e of es.filter(e => e.isIntersecting).sort((a, b) => a.target.compareDocumentPosition(b.target) & 4 ? -1 : 1)) {
  seen.unobserve(e.target); queue.push(...e.target._writers); }
  if (queue.length && !running) { running = true; requestAnimationFrame(run); } }, { threshold: .15 });
function score(panel, writers) { panel._writers = writers; seen.observe(panel); }
const ONLY = q.get('only'), PERF = [];
for (const key of Object.keys(DIRS).filter(k => !ONLY || ONLY === k)) {
  const D = DIRS[key], sec = document.createElement('section'); sec.className = 'dir'; sec.id = key;
  sec.innerHTML = `<h2>${D.name}</h2><p class="note">${NOTES[key]}</p><div class="pair"></div><div class="zoom"></div>`;
  document.getElementById('out').append(sec);
  const z = sec.querySelector('.zoom'), fig = (el, cap, theme) => { const f = document.createElement('figure'); if (theme) f.dataset.theme = theme; f.append(el); const fc = document.createElement('figcaption'); fc.textContent = cap; f.append(fc); z.append(f); return f; };
  { const f = document.createElement('div'); f.className = 'refs'; for (const [src, cap] of REFS[key]) { const fg = document.createElement('figure'); fg.innerHTML = `<img src="copperplate-refs/${src}" alt=""><figcaption>${cap}</figcaption>`; f.append(fg); } z.append(f); }
  let iniH = 0;
  for (const theme of ['light', 'dark']) {
    const panel = document.createElement('div'); panel.className = 'panel'; panel.dataset.theme = theme;
    const text = document.createElement('div'); text.className = 'text'; text.append(document.getElementById('txt').content.cloneNode(true)); panel.append(text);
    sec.querySelector('.pair').append(panel);
    const cs = getComputedStyle(text), fs = parseFloat(cs.fontSize), lh = parseFloat(cs.lineHeight), n = innerWidth < 600 ? 3 : 4;
    const capTop = (lh - fs) / 2 + fs * .2, H = (n - 1) * lh + fs * .72; iniH = H;
    const panelWriters = [];
    const place = (o, x, y) => { const el = o.el ?? o; if (o.writers) panelWriters.push(...o.writers); Object.assign(el.style, { position: 'absolute', left: x - PAD + 'px', top: y - PAD + 'px', pointerEvents: 'none' }); text.append(el); };
    const tp = performance.now(), ini0 = D.initial('B', H, seed, dpr), ispan = text.querySelector('.ini');
    Object.assign(ispan.style, { width: ini0.W + fs * .3 + 'px', height: n * lh + 'px', lineHeight: '1px', fontSize: '1px' });
    const par0 = D.paraph(fs, seed, dpr), pf = text.querySelector('.pf'); pf.style.width = par0.W + fs * .3 + 'px'; pf.style.height = '1px';
    const tr = text.getBoundingClientRect(), ir = ispan.getBoundingClientRect();
    place(printed(key, theme, d => D.initial('B', H, seed, d), 1, DRAW), ir.left - tr.left, ir.top - tr.top + capTop);
    const pr = pf.getBoundingClientRect(), base = pr.bottom - tr.top;
    place(printed(key, theme, d => D.paraph(fs, seed, d), 1, DRAW), pr.left - tr.left, base - par0.H * (par0.base ?? .9));
    const p = text.querySelector('p.fill'), rg = document.createRange(); rg.selectNodeContents(p); const last = [...rg.getClientRects()].at(-1);
    const x0 = last.right - tr.left + fs * .3, gw = tr.width - x0;
    if (gw > fs * 2) { const fl = D.filler(gw, lh, seed, dpr); place(printed(key, theme, d => D.filler(gw, lh, seed, d), 1, DRAW), x0, last.top - tr.top + (last.height - fl.H) / 2 + fs * .12); }
    const hr = text.querySelector('hr').getBoundingClientRect(), bw = Math.min(tr.width * .7, 380);
    place(printed(key, theme, d => D.brk(bw, hr.height, seed, d), 1, DRAW), (tr.width - bw) / 2, hr.top - tr.top);
    const bq = text.querySelector('blockquote').getBoundingClientRect(), csz = fs * 1.2;
    place(printed(key, theme, d => D.corner(csz, seed, d), 1, DRAW), bq.left - tr.left, bq.top - tr.top);
    PERF.push(`${key} ${theme}: ${Math.round(performance.now() - tp)} ms`);
    if (DRAW) score(panel, panelWriters);
    fig(printed(key, theme, d => D.initial(theme === 'light' ? 'B' : letters[2] ?? 'R', H, seed, d), 4), `initial, 4× (${theme})`, theme);
    fig(printed(key, theme, d => D.paraph(fs, seed, d), 4), `paraph, 4×`, theme);
    fig(printed(key, theme, d => D.filler(150, lh, seed, d), 4), `filler, 4×`, theme);
    fig(printed(key, theme, d => D.brk(bw, hr.height, seed, d), 2), `break, 2×`, theme);
    fig(printed(key, theme, d => D.corner(csz, seed, d), 3), `quotation’s head, 3×`, theme);
  }
  // the master beside ours, at the same height: page size, then 4x (the master's 4x is its scan enlarged, so soft)
  for (const [what, src] of SIDES_OF[key]) { const side = document.createElement('div'); side.className = 'side';
    const mk = d => what === 'drop' ? D.initial('B', iniH, seed, d) : what === 'filler' ? D.filler(300, 32, seed, d) : D.brk(380, 54, seed, d);
    for (const zz of [1, 4]) { const cv = printed(key, 'light', mk, zz), im = document.createElement('img'); im.src = `copperplate-refs/${src}`; im.style.height = cv.style.height; im.style.width = 'auto'; side.append(im, cv); }
    fig(side, `${what}: the master (left) beside ours, at the same height: page size, then 4×`, 'light'); }
  for (const theme of ['light', 'dark']) {
    const row = document.createElement('div'); row.style.cssText = 'display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end';
    for (const ch of letters) row.append(printed(key, theme, d => D.initial(ch, iniH, seed + ch.charCodeAt(0), d)));
    fig(row, `${letters.join(' ')}, page size (${theme})`, theme);
  }
}
const ms = Math.round(performance.now() - t0); document.body.dataset.timing = `drawn in ${ms} ms`; document.body.dataset.perf = PERF.join('; ');
document.getElementById('timing').textContent = `Drawn in ${ms} ms. A page’s ornament (initial, paraph, filler, break, quotation): ${PERF.join('; ')}.`;
</script>
</body>
</html>
