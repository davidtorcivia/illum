<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Insular paint</title>
<!--
  The paint bench (research/21-paint.md): each subject three ways at the same physical scale — the master (Lindisfarne
  f. 139r, BL photograph, 12.25 px/mm; crops in insular-refs/, not committed), the physical paint (tests/km-paint.js: brush
  loads, levelling, two-constant Kubelka–Munk over a parchment, a pen laid over time, weathering by cause, tests/km-age.js)
  and the smoke-and-mirrors control (flat palette colours, one soft optic, cheap tricks; no simulation).
  Figures, in order, per subject: master, physical, control. Subjects: knot, dots, orpiment band, red-lead keys.
  ?z=      zoom (1: the page's size, .15 mm per css px)      ?pxmm=  render at exactly this many px per mm (matched sampling)
  ?age=    0..1 (default .35)                                ?psf=   a camera's softness over ours, mm (0)
  ?only=   one subject (knot|dots|band|keys)                 ?seed=  the hand and the brush
-->
<style>
  html { background: #8a8580; } body { margin: 0; padding: 16px; font: 12px/1.4 sans-serif; color: #eee; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start; margin-bottom: 14px; } figure { margin: 0; } img, canvas { display: block; }
</style>
</head>
<body>
<script type="module">
import * as KM from './km-paint.js';
import * as AGE from './km-age.js';
import * as SM from './km-smoke.js';
import * as KM_B from './km-bench.js';
const q = new URLSearchParams(location.search), Z = +(q.get('z') ?? 4), dpr = Math.min(2, devicePixelRatio || 1);
const MM = KM_B.MM, PXMM = q.get('pxmm') ? +q.get('pxmm') : dpr * Z / MM, CSS = Z / MM;   // render px per mm; css px per mm
const age = +(q.get('age') ?? .35), psf = +(q.get('psf') ?? 0), seed = +(q.get('seed') ?? 1), only = q.get('only');
const timing = {};

// ---- figures --------------------------------------------------------------------------------------------------------------------
let row = null;
const fig = (el, cap) => { const f = document.createElement('figure'); f.append(el, Object.assign(document.createElement('figcaption'), { textContent: cap })); row.append(f); };
const show = (G, img, cap) => { const c = document.createElement('canvas'); c.width = G.w; c.height = G.h; c.style.width = (G.w / G.pxmm * CSS) + 'px';
  const t = new OffscreenCanvas(G.w, G.h); t.getContext('2d').putImageData(img, 0, 0); const x = c.getContext('2d');
  if (psf) x.filter = `blur(${(psf * G.pxmm).toFixed(2)}px)`; x.drawImage(t, 0, 0); fig(c, cap); };
const master = (src, cap) => { const im = new Image(); im.src = './insular-refs/' + src; im.onload = () => { im.style.width = (im.naturalWidth / 12.25 * CSS) + 'px'; }; im.onerror = () => im.remove(); fig(im, cap); };
const subject = (name, fn) => { if (only && only !== name) return; row = document.createElement('div'); row.className = 'row'; document.body.append(row); fn(); };

// each subject: the master, the physical paint, the control, at one physical scale
function bench(name, src, cap, geoF, layersF, smokeF, wopt = {}) {
  subject(name, () => {
    const geo = geoF(seed); master(src, cap);
    { const t0 = performance.now(), G = new KM.Grid(geo.box, PXMM), { layers, P } = layersF(G, geo, { seed }), t1 = performance.now();
      const A = AGE.weather(G, P, layers, { age, seed, ...wopt }), t2 = performance.now(), out = KM.compose(G, P, A.layers), t3 = performance.now();
      timing[name] = { physical: Math.round(t3 - t0), layers: Math.round(t1 - t0), weather: Math.round(t2 - t1), compose: Math.round(t3 - t2), px: G.n };
      show(G, KM.toImage(G, out), `physical, age ${age} (${Math.round(t3 - t0)} ms: loads ${Math.round(t1 - t0)}, age ${Math.round(t2 - t1)}, KM ${Math.round(t3 - t2)}; ${G.w}×${G.h})`); }
    { const t0 = performance.now(), G = new KM.Grid(geo.box, PXMM), img = smokeF(G, geo, { seed }), t1 = performance.now();
      timing[name + 'Smoke'] = Math.round(t1 - t0); show(G, img, `control: smoke and mirrors (${Math.round(t1 - t0)} ms)`); }
  });
}
bench('knot', 'm-knot.png', 'master: f. 139r, a blue knot in the bowl (white-balanced to our vellum)', KM_B.knotGeometry, KM_B.knotLayers, KM_B.knotSmoke);
bench('dots', 'm-dots.png', 'master: f. 139r, red-lead dot fields', KM_B.dotsGeometry, KM_B.dotsLayers, KM_B.dotsSmoke);
bench('band', 'm-O.png', 'master: f. 139r, the O: orpiment ring, red-lead and blue keys', KM_B.bandGeometry, KM_B.bandLayers, KM_B.bandSmoke);
bench('keys', 'm-O.png', 'master: (same crop) the keys', KM_B.keysGeometry, KM_B.keysLayers, KM_B.keysSmoke);
document.body.dataset.timing = JSON.stringify(timing);
</script>
</body>
</html>
