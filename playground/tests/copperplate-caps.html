<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Copperplate capitals</title>
<!--
  C's capital alone (UnifrakturMaguntia, its shades cut back), at 1x, 4x and 8x, by each cut: none (the face's own
  drawing), morph (thinShades: the pixel cut of stage 4) and vector (cutShades: the outline offset along the strokes, stage 6).
  ?letters=BLRSAM  ?cut=none,morph,vector
-->
<style> body { margin: 0; background: #eee; font: 12px sans-serif; } .row { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px; align-items: flex-end; } figure { margin: 0; background: rgb(244 238 226); padding: 6px; } canvas { display: block; } </style>
</head>
<body><div id="out"></div>
<script type="module">
import { coverage, glyph, thinShades, thinShadesFine, cutShades, engrave } from '../kit/styles/copperplate-print.js';
const q = new URLSearchParams(location.search), letters = (q.get('letters') ?? 'BLRSAM').split(''), cuts = (q.get('cut') ?? 'none,morph,fine').split(',');
const ff = new FontFace('CopperC', 'url(../fonts/UnifrakturMaguntia-Book.woff2)'); await ff.load(); document.fonts.add(ff);
const dpr = Math.min(2, devicePixelRatio || 1), H = 108, cap = H * .5, out = document.getElementById('out');
for (const zoom of [1, 4, 8]) for (const cut of cuts) {
  const row = document.createElement('div'); row.className = 'row'; row.append(Object.assign(document.createElement('b'), { textContent: `${cut} ${zoom}x` })); out.append(row);
  for (const ch of letters) {
    const W = cap * 1.2, d = dpr * zoom, res = Math.max(2, d * 1.25), box = [0, 0, W, W], cv = document.createElement('canvas');
    cv.width = Math.ceil(W * d); cv.height = Math.ceil(W * d); cv.style.width = W * zoom + 'px'; cv.style.height = W * zoom + 'px';
    const draw = glyph(ch, '"CopperC"', cap, W / 2, W / 2), L0 = coverage([], box, res, draw);
    const L = cut === 'morph' ? thinShades(L0, .42, res * .9) : cut === 'vector' ? cutShades(L0, draw, { k: .42, tau0: res * .9 }) : cut === 'fine' ? thinShadesFine(draw, box, res, .42, res * .9, zoom > 2 ? 2 : 3) : L0;
    engrave(cv.getContext('2d'), L, [30, 25, 24], { dpr: d, flat: true });
    const f = document.createElement('figure'); f.append(cv); row.append(f);
  }
}
document.body.dataset.timing = 'done';
</script>
</body>
</html>
