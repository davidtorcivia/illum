<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nouveau directions</title>
<!--
  Nouveau, direction studies (research/19-nouveau.md): A and B, each with an initial, a filler and a break, at page size in
  light and dark, then at 4×. Drawn live as vector (tests/nouveau-directions.js on kit/styles/nouveau-line.js).
  ?only=fouet|plante|vienne  ?letters=BLRS  #seed=n
-->
<style>
  @font-face { font-family: "EB Garamond"; src: url(../fonts/EBGaramond-normal.woff2) format("woff2"); font-weight: 400 600; font-style: normal; font-display: block; }
  @font-face { font-family: "EB Garamond"; src: url(../fonts/EBGaramond-italic.woff2) format("woff2"); font-weight: 400; font-style: italic; font-display: block; }
  @font-face { font-family: NouveauBocklin; src: url(../fonts/nouveau/Bocklin.ttf) format("truetype"); font-display: block; }
  html { background: rgb(236 231 220); }
  body { margin: 0; font: 400 20px/1.6 "EB Garamond", Garamond, serif; color: #2b2119; -webkit-font-smoothing: antialiased; }
  header { max-width: 1320px; margin: 0 auto; padding: 40px 24px 0; }
  header h1 { font-weight: 500; font-size: 1em; letter-spacing: .14em; text-transform: uppercase; margin: 0; }
  header p { font-style: italic; margin: .2em 0 0; font-size: .9em; }
  section.dir { max-width: 1320px; margin: 0 auto; padding: 36px 24px 12px; }
  section.dir > h2 { font-weight: 500; font-size: 1em; letter-spacing: .1em; text-transform: uppercase; margin: 0 0 .2em; }
  section.dir > p.note { margin: 0 0 1em; font-style: italic; font-size: .9em; max-width: 52em; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .panel { position: relative; padding: 44px 44px 40px 56px; background: var(--paper); color: var(--ink); }
  .panel[data-theme=light] { --paper: rgb(244 238 226); --ink: #2b2119; }
  .panel[data-theme=dark] { --paper: rgb(28 25 22); --ink: rgb(222 212 196); }
  .panel .text { position: relative; hyphens: auto; text-align: justify; max-width: 560px; }
  .panel p { margin: 0; } .panel p.par { text-indent: 1.8em; }
  .panel hr { border: 0; height: 3.6em; margin: .4em 0; }
  .panel canvas.over { position: absolute; left: 0; top: 0; pointer-events: none; }
  .ini { float: left; color: transparent; }
  .zoom { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 16px; align-items: flex-start; }
  .zoom figure { margin: 0; background: var(--paper); padding: 16px; }
  .zoom figure[data-theme=light] { --paper: rgb(244 238 226); --ink: #2b2119; }
  .zoom figure[data-theme=dark] { --paper: rgb(28 25 22); --ink: rgb(222 212 196); }
  .zoom figcaption { font: italic 13px/1.3 "EB Garamond", serif; color: var(--ink); opacity: .7; margin-top: 6px; }
  .zoom canvas { display: block; max-width: 100%; height: auto !important; }
  .refs { display: flex; gap: 12px; flex-wrap: wrap; width: 100%; }
  .refs figure { margin: 0; padding: 0; background: none; }
  .refs img { display: block; height: 300px; width: auto; max-width: 100%; object-fit: contain; }
  .refs figcaption { color: #2b2119; }
  .zoom figure { max-width: 100%; box-sizing: border-box; }
  .panel { overflow: hidden; }
  @media (max-width: 900px) {
    body { font-size: 18px; line-height: 1.55; }
    .pair { grid-template-columns: 1fr; }
    .panel { padding: 32px 20px 28px 20px; }
    .panel .text { text-align: left; }
    section.dir { padding: 28px 0 8px; } header, section.dir > h2, section.dir > p.note { padding-left: 16px; padding-right: 16px; }
  }
</style>
</head>
<body>
<header><h1>Nouveau · two directions</h1><p>Each: an initial, a line-filler and a break at page size, light and dark; then the initial, filler and break enlarged. Seed <span id="seed"></span>.</p></header>
<template id="txt">
  <p><span class="ini">B</span>ut our higher instincts are not deceived. We take no pleasure in the building provided for us, resembling that which we take in a new book or a new picture. We may be proud of its size, complacent in its correctness, and happy in its convenience. We may take the same pleasure in its symmetry and workmanship as in a well-ordered room, or a skilful piece of manufacture.</p>
  <p class="par fill">Yet all this is true, and self-evident; only hidden from us, as many other self-evident things are, by false teaching. Nothing is a great work of art for which rules or models can be given.</p>
  <hr>
  <p>A medieval book had no page numbers, no index and no search. Its readers found their way by its ornament: every mark said where you were and how much it mattered.</p>
</template>
<main id="out"></main>
<script type="module">
import { DIRS, PAL, ORDER, KEYS, PENS, PALW, WASH, setLine } from './nouveau-directions.js';
import { render } from '../kit/styles/nouveau-print.js';
import { loadLetter } from '../kit/styles/nouveau-line.js';
const q = new URLSearchParams(location.search), seed = +(location.hash.match(/seed=(\d+)/)?.[1] ?? 7);
document.getElementById('seed').textContent = seed;
const letters = (q.get('letters') ?? 'BLRS').split('');
const LET = {}; await Promise.all([...new Set(['B', ...letters])].map(async c => LET[c] = await loadLetter(c)));
await document.fonts.load('20px "EB Garamond"');
const dpr = Math.min(2, devicePixelRatio || 1), PAD = 6, t0 = performance.now();
const NOTES = {
  inked: 'The whip written by the ink engine’s pen (kit/medium.js Pen, via nouveau-ink.js inkWrite): a pointed pen following each line at a hand’s pace, slowing into turns and at the ends (where the ink pools) and quick through the long runs; the designed swells are its pressure; the spiral’s eye is wound in by the same movement and pools. The letter is printed. Compare Combinaisons pl. 11 and 58 above.',
  printed: 'As before, the flowers redrawn: the iris’s falls broad and drooping, the poppy an open bowl. Chromolithographed: a stone an ink, trapped, slipped, the key printed last.',
  watercolour: 'The same drawing laid as watercolour (nouveau-ink.js washPour, in the same medium): each colour one transparent wash, the paper’s tooth catching the pigment, the pigment drawn to the wash’s edge as it dries, a back-run here and there, the shade glazed wet into wet over the colour; a finer sepia line over the washes.',
  fouet: 'The line (Verneuil, Auriol and Mucha, Combinaisons ornementales, 1901; Obrist, 1895). The whip rises from the letter’s foot following its bowls at a fixed distance, a hairline doubling it for a stretch, lifts over the letter and winds into a spiral with a solid eye; a stem from the same root crosses it into a seed head. Pen pressure: heavier pulled down, lighter pushed up. Printed: each ink a stone, slipped a little off register, through the ink engine.',
  plante: 'The plant in a panel (Grasset, La plante et ses applications ornementales, 1896). The ground laid, the letter applied in rose with a contour that has a hand (heavier on the shadow side, fine at tips, lifting off in the light); the stem follows the letter’s bowls; blades twist to show their backs; the iris drawn after pl. 1 (narrow standards, frilled falls with their gold signal and veins, a darker stone on the shaded half), a furled bud over the letter’s shoulder. Chromolithographed: a stone an ink, trapped, slipped, the key printed last.',
};
// a piece printed onto its own canvas, PAD px of margin round it, at zoom
function printed(key, theme, piece, zoom = 1) {
  const { P, W, H } = piece, d = dpr * zoom, cv = document.createElement('canvas');
  cv.width = Math.ceil((W + PAD * 2) * d); cv.height = Math.ceil((H + PAD * 2) * d); cv.style.width = (W + PAD * 2) * zoom + 'px'; cv.style.height = (H + PAD * 2) * zoom + 'px';
  const M = new DOMMatrix().translate(PAD, PAD); for (const it of P.items) { const p = new Path2D(); p.addPath(it.path, M); it.path = p; if (it.cut && !it.cut.moved) { const c = new Path2D(); c.addPath(it.cut.path, M); it.cut = { ...it.cut, path: c, moved: 1 }; }
    if (it.S && !it.S.moved) { it.S.p = it.S.p.map(([x, y]) => [x + PAD, y + PAD]); if (it.S.eye) it.S.eye = [it.S.eye[0] + PAD, it.S.eye[1] + PAD, it.S.eye[2]]; it.S.moved = 1; } }
  const wc = VAR === 'watercolour';
  render(P, cv.getContext('2d'), { dpr: d, pal: wc ? PALW[theme] : PAL[key][theme], seed, box: [0, 0, W + PAD * 2, H + PAD * 2], order: ORDER[key], keys: KEYS[key], slip: wc ? Math.max(.25, H * .002) : Math.max(.35, H * .004), pens: PENS[key], wash: wc ? WASH : null });
  return cv;
}
let VAR = null;
const VARIANTS = [['fouet', 'inked'], ['plante', 'printed'], ['plante', 'watercolour']].filter(([k, v]) => (!q.get('only') || q.get('only') === k) && (!q.get('var') || q.get('var') === v));
for (const [key, variant] of VARIANTS) {
  const D = DIRS[key]; VAR = variant; setLine(variant === 'watercolour' ? .62 : 1);
  const sec = document.createElement('section'); sec.className = 'dir';
  sec.innerHTML = `<h2>${D.name} · ${variant}</h2><p class="note">${NOTES[variant]}</p><div class="pair"></div><div class="zoom"></div>`;
  document.getElementById('out').append(sec);
  const z = sec.querySelector('.zoom'), fig = (el, cap, theme) => { const f = document.createElement('figure'); if (theme) f.dataset.theme = theme; f.append(el); const fc = document.createElement('figcaption'); fc.textContent = cap; f.append(fc); z.append(f); return f; };
  { const f = document.createElement('div'); f.className = 'refs'; for (const [src, cap] of D.refs) { const fg = document.createElement('figure'); fg.innerHTML = `<img src="nouveau-refs/${src}" alt=""><figcaption>${cap}</figcaption>`; f.append(fg); } z.append(f); }
  for (const theme of ['light', 'dark']) {
    const panel = document.createElement('div'); panel.className = 'panel'; panel.dataset.theme = theme;
    const text = document.createElement('div'); text.className = 'text'; text.append(document.getElementById('txt').content.cloneNode(true)); panel.append(text);
    sec.querySelector('.pair').append(panel);
    const fs = parseFloat(getComputedStyle(text).fontSize), lh = parseFloat(getComputedStyle(text).lineHeight), n = +(q.get('lines') ?? 4);
    const capTop = (lh - fs) / 2 + fs * .27, H = (n - 1) * lh + fs * .62;
    const ini = D.initial(LET.B, H, seed), ispan = text.querySelector('.ini');
    Object.assign(ispan.style, { width: ini.W + fs * .4 + 'px', height: n * lh + 'px', lineHeight: '1px', fontSize: '1px' });
    const place = (cv, x, y) => { cv.style.position = 'absolute'; cv.style.left = x - PAD + 'px'; cv.style.top = y - PAD + 'px'; cv.style.pointerEvents = 'none'; text.append(cv); };
    const tr = text.getBoundingClientRect(), ir = ispan.getBoundingClientRect();
    place(printed(key, theme, ini), ir.left - tr.left, ir.top - tr.top + capTop);
    const p = text.querySelector('p.fill'), rg = document.createRange(); rg.selectNodeContents(p); const last = [...rg.getClientRects()].at(-1);
    const x0 = last.right - tr.left + fs * .3, gw = tr.width - x0;
    if (gw > fs * 2) { const fl = D.filler(gw, lh, seed); place(printed(key, theme, fl), x0, last.top - tr.top + (last.height - lh) / 2); }
    const hr = text.querySelector('hr').getBoundingClientRect(), bw = Math.min(tr.width * .62, 360), bk = D.brk(bw, hr.height, seed);
    place(printed(key, theme, bk), (tr.width - bw) / 2, hr.top - tr.top);
    fig(printed(key, theme, D.initial(LET[theme === 'light' ? 'B' : letters[2] ?? 'R'], H, seed), 4), `initial, 4× (${theme})`, theme);
    fig(printed(key, theme, D.filler(150, lh, seed), 4), `filler, 4× (${theme})`, theme);
    fig(printed(key, theme, D.brk(bw, hr.height, seed), 2), `break, 2× (${theme})`, theme);
  }
  for (const theme of ['light', 'dark']) {
    const row = document.createElement('div'); row.style.cssText = 'display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end';
    for (const ch of letters) row.append(printed(key, theme, D.initial(LET[ch], 3 * 32 + 12.4, seed + ch.charCodeAt(0))));
    fig(row, `${letters.join(' ')}, page size (${theme})`, theme);
  }
}
document.body.dataset.timing = `drawn in ${Math.round(performance.now() - t0)} ms`;
</script>
</body>
</html>
