<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nouveau pieces</title>
<!--
  A sheet of Nouveau's pieces (kit/styles/nouveau.js), each printed alone by the style's own print() and pour.paint, so
  nothing is cut by a page's layout: the breaks of each rank, the fillers, the paraphs, the margin and the frame, three
  seeds each, at page size and at 3×. ?kind=fouet (default) | plante; ?fpaint=gouache | wash; ?paint=; ?theme=dark.
-->
<style>
  @font-face { font-family: "EB Garamond"; src: url(../fonts/EBGaramond-normal.woff2) format("woff2"); font-weight: 400 600; font-style: normal; font-display: block; }
  @font-face { font-family: "EB Garamond"; src: url(../fonts/EBGaramond-italic.woff2) format("woff2"); font-weight: 400; font-style: italic; font-display: block; }
  :root { --paper: rgb(244 238 226); --ink: #2b2119; color-scheme: light; }
  :root[data-theme=dark] { --paper: rgb(28 25 22); --ink: rgb(222 212 196); color-scheme: dark; }
  html { background: var(--paper); } body { margin: 0; color: var(--ink); font: 400 18px/1.5 "EB Garamond", serif; padding: 32px 24px; }
  h2 { font-weight: 500; font-size: 1em; letter-spacing: .1em; text-transform: uppercase; margin: 1.6em 0 .4em; }
  .row { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-end; }
  figure { margin: 0; } figcaption { font-style: italic; font-size: 13px; opacity: .6; }
  canvas { display: block; max-width: 100%; height: auto !important; outline: 1px dashed color-mix(in srgb, var(--ink) 12%, transparent); }
</style>
</head>
<body>
<main id="out"></main>
<script type="module">
import nouveau from '../kit/styles/nouveau.js';
const q = new URLSearchParams(location.search);
document.documentElement.dataset.theme = q.get('theme') === 'dark' ? 'dark' : 'light';
nouveau.kind = q.get('kind') ?? 'fouet'; nouveau.paint = q.get('paint') ?? 'watercolour'; nouveau.fpaint = q.get('fpaint') ?? 'gouache';
for (const c of 'BRSLT') document.body.append(Object.assign(document.createElement('span'), { className: 'ini', hidden: true, textContent: c }));   // (the letters this sheet shows, for initial.load)
await nouveau.initial.load();
const EDGES = [], u = 9.6, dpr = Math.min(2, devicePixelRatio || 1), out = document.getElementById('out'), t0 = performance.now();
// a made case printed onto a canvas of its own, its ink's whole box shown (the outline is that box: nothing is cut inside it)
function sheet(made, zoom) {
  const pr = nouveau.print(made, { dpr: dpr * zoom, kind: 'part' }); let b = [1e9, 1e9, -1e9, -1e9];
  for (const p of pr.pours) b = [Math.min(b[0], p.x0), Math.min(b[1], p.y0), Math.max(b[2], p.x0 + p.w / p.res), Math.max(b[3], p.y0 + p.h / p.res)];
  const d = dpr * zoom, cv = document.createElement('canvas'); cv.width = Math.ceil((b[2] - b[0]) * d); cv.height = Math.ceil((b[3] - b[1]) * d);
  cv.style.width = (b[2] - b[0]) * zoom + 'px'; cv.style.height = (b[3] - b[1]) * zoom + 'px';
  const g = cv.getContext('2d'), proxy = { save() { g.save(); }, restore() { g.restore(); }, setTransform() {}, set globalCompositeOperation(v) { g.globalCompositeOperation = v; },
    drawImage(c, ...a) { if (a.length === 8) g.drawImage(c, a[0], a[1], a[2], a[3], a[4] - b[0] * d, a[5] - b[1] * d, a[6], a[7]); else g.drawImage(c, a[0] * d - b[0] * d, a[1] * d - b[1] * d, a[2] * d, a[3] * d); } };
  for (const p of pr.pours) p.paint(proxy, { dpr: d });
  // (the check: no ink may reach the raster's edge, or something was cut)
  const im = g.getImageData(0, 0, cv.width, cv.height).data, W = cv.width, H = cv.height; let hit = 0;
  for (let i = 0; i < W; i++) for (const j of [0, H - 1]) if (im[(j * W + i) * 4 + 3] > 8) hit++;
  for (let j = 0; j < H; j++) for (const i of [0, W - 1]) if (im[(j * W + i) * 4 + 3] > 8) hit++;
  if (hit) { EDGES.push(hit); cv.style.outline = '2px solid red'; }
  return cv;
}
const row = title => { const h = document.createElement('h2'); h.textContent = title; out.append(h); const r = document.createElement('div'); r.className = 'row'; out.append(r); return r; };
const fig = (r, el, cap) => { const f = document.createElement('figure'); f.append(el); const c = document.createElement('figcaption'); c.textContent = cap; f.append(c); r.append(f); };
const seeds = [1, 2, 3, 4];
for (const zoom of [1, 3]) {
  const z = zoom > 1 ? ` · ${zoom}×` : '';
  let r = row('Breaks, rank 1' + z); for (const s of seeds) fig(r, sheet(nouveau.breakMark(200, 40, 400, 1, s, .5, u), zoom), 'seed ' + s);
  r = row('Breaks, rank 2' + z); for (const s of seeds.slice(0, 3)) fig(r, sheet(nouveau.breakMark(260, 40, 520, 2, s, .5, u), zoom), 'seed ' + s);
  r = row('Break, rank 3' + z); for (const s of [1, 2]) fig(r, sheet(nouveau.breakMark(300, 40, 600, 3, s, .5, u), zoom), 'seed ' + s);
  r = row('Initials' + z); for (const s of [1, 2, 3]) fig(r, sheet(nouveau.initial({ ch: 'BRS'[s - 1], G: { box: [10, 10, 0, 118.4] }, big: true, seed: s, u }), zoom), 'seed ' + s); for (const s of [1, 2]) fig(r, sheet(nouveau.initial({ ch: 'LT'[s - 1], G: { box: [10, 10, 0, 26] }, big: false, seed: s, u }), zoom), 'in the line');
  r = row('Fillers' + z); for (const s of seeds) fig(r, sheet(nouveau.filler(0, 300, 30, 30 + u, 'vine', s, .5), zoom), 'seed ' + s);
  r = row('Paraphs and contents marks' + z); for (const s of [1, 2, 3]) fig(r, sheet(nouveau.paraph(0, 40, u, s, .5), zoom), 'seed ' + s);
  r = row('Quotation margin' + z); for (const s of [1, 2]) fig(r, sheet(nouveau.frames.quote({ box: [60, 20, 400, 120], lines: [{ left: 60, right: 400, top: 20, base: 120 }], u, seed: s }), zoom), 'seed ' + s);
  r = row('Pull quote' + z); fig(r, sheet(nouveau.frames.pull({ cx: 200, yTop: 40, yBot: 140, measure: 560, u, seed: 3 }), zoom), 'seed 3');
  r = row('Code frame' + z); fig(r, sheet(nouveau.frames.code({ box: [40, 40, 400, 160], u, seed: 2 }), zoom), 'seed 2');
  r = row('Contents marks' + z); fig(r, sheet(nouveau.frames.nav({ box: [60, 20, 300, 100], entries: [{ base: 30 }, { base: 52 }, { base: 74 }], u, seed: 1 }), zoom), 'seed 1');
  r = row('Figure frame' + z); for (const s of [1, 2]) fig(r, sheet(nouveau.frames.figure({ box: [40, 40, 300, 200], u, seed: s }), zoom), 'seed ' + s);
}
document.body.dataset.timing = `drawn in ${Math.round(performance.now() - t0)} ms; cut at the edge: ${EDGES.length}`;
</script>
</body>
</html>
