<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blackletter faces</title>
<!--
  Choosing the face the blackletter drop initial takes its letter from (kit/styles/blackletter.js, FACES). Each row: one
  face as a four-line drop initial B on a paragraph, fitted as the specimen fits it (top on the first line's cap height,
  foot on the fourth line's baseline), then A D M S T at the same size. Every letter laid by the ink engine, with the
  same ornament (?rich=0..1, default .75). ?theme=dark; ?faces=maguntia,cook (default: all); #seed=n.
-->
<style>
  @font-face { font-family: "EB Garamond"; src: url(../fonts/EBGaramond-normal.woff2) format("woff2"); font-weight: 400 600; font-style: normal; font-display: block; }
  @font-face { font-family: "EB Garamond"; src: url(../fonts/EBGaramond-italic.woff2) format("woff2"); font-weight: 400; font-style: italic; font-display: block; }
  :root { --paper: rgb(244 238 226); --ink: #2b2119; --rubric: rgb(170 44 28); color-scheme: light; }
  :root[data-theme=dark] { --paper: rgb(28 25 22); --ink: rgb(222 212 196); --rubric: rgb(232 110 86); color-scheme: dark; }
  html { background: var(--paper); }
  body { margin: 0; color: var(--ink); font: 400 18px/1.55 "EB Garamond", Garamond, serif; -webkit-font-smoothing: antialiased; }
  .sheet { position: relative; padding: 40px 40px 60px; }
  .sheet > canvas { position: absolute; left: 0; top: 0; pointer-events: none; }
  .row { display: grid; grid-template-columns: 520px 1fr; gap: 60px; align-items: start; padding: 34px 0 30px 70px; border-top: 1px solid color-mix(in srgb, var(--ink) 15%, transparent); }
  .row h2 { grid-column: 1 / -1; margin: 0 0 .2em -70px; font: italic 400 15px/1.2 "EB Garamond", serif; opacity: .7; }
  .text { text-align: justify; hyphens: auto; }
  .text p { margin: 0; }
  .ini { color: transparent; font-weight: 600; }
  .ini.drop { float: left; line-height: 1; }
  .alone { position: relative; height: 1px; }
</style>
</head>
<body>
<main class="sheet"><canvas id="bake" aria-hidden="true"></canvas></main>
<script type="module">
import { createWriter, supported } from '../kit/writer.js';
import S, { FACES, loadFace, inkLetter } from '../kit/styles/blackletter.js';
const T0 = performance.now(), q = new URLSearchParams(location.search), dark = q.get('theme') === 'dark';
if (dark) document.documentElement.dataset.theme = 'dark';
const names = (q.get('faces') ?? Object.keys(FACES).join(',')).split(','), RICH = +(q.get('rich') ?? .75), LEVEL = Math.round(RICH * 4), SEED = +(location.hash.match(/seed=(\d+)/)?.[1] ?? 3);
const TEXT = 'ut our higher instincts are not deceived. We take no pleasure in the building provided for us, resembling that which we take in a new book or a new picture. We may be proud of its size, complacent in its correctness, and happy in its convenience. We may take the same pleasure in its symmetry and workmanship as in a well-ordered room, or a skilful piece of manufacture.';
const sheet = document.querySelector('.sheet'), bk = document.getElementById('bake');
for (const n of names) sheet.insertAdjacentHTML('beforeend', `<section class="row" data-face="${n}"><h2>${FACES[n].name}</h2><div class="text"><p><span class="ini drop" data-lines="4">B</span>${TEXT}</p></div><div class="alone"></div></section>`);
await document.fonts.ready; await Promise.all(names.map(loadFace)); const TF = performance.now() - T0;
const c = document.createElement('canvas').getContext('2d'); c.font = '600 100px "EB Garamond"'; const Hm = c.measureText('H');
const MET = { asc: Hm.fontBoundingBoxAscent / 100, desc: Hm.fontBoundingBoxDescent / 100, cap: Hm.actualBoundingBoxAscent / 100 };
const o = sheet.getBoundingClientRect(), items = [], Tc0 = performance.now();
for (const row of sheet.querySelectorAll('.row')) {
  const face = row.dataset.face, s = row.querySelector('.ini'), p = s.parentElement, cs = getComputedStyle(p), fs = parseFloat(cs.fontSize), lh = parseFloat(cs.lineHeight), n = 4;
  // as the specimen: top on the first line's cap height, foot on the n-th baseline, the float cut to n lines
  const base = (lh - (MET.asc + MET.desc) * fs) / 2 + MET.asc * fs, F = ((n - 1) * lh + fs * MET.cap) / MET.cap, top = (n - 1) * lh + base - F * ((1 - MET.asc - MET.desc) / 2 + MET.asc), H = F * MET.cap;
  Object.assign(s.style, { fontSize: F + 'px', marginTop: top + 'px', height: (n * lh - 2 - top) + 'px', display: 'block', width: S.initial.width('B', face) * H + 'px', marginRight: Math.round(lh * .38) + 'px' });
}
const O = sheet.getBoundingClientRect();
for (const row of sheet.querySelectorAll('.row')) {
  const face = row.dataset.face, s = row.querySelector('.ini'), F = parseFloat(s.style.fontSize), rg = document.createRange(); rg.selectNodeContents(s); const rc = rg.getClientRects()[0];
  const base = rc.top - O.top + MET.asc * F + (rc.height - (MET.asc + MET.desc) * F) / 2, H = MET.cap * F, x0 = rc.left - O.left;
  const keep = []; const tw = document.createTreeWalker(row.querySelector('p'), NodeFilter.SHOW_TEXT);
  for (let t; (t = tw.nextNode());) { if (t.parentElement.closest('.ini')) continue; const r2 = document.createRange(); r2.selectNodeContents(t); for (const r of r2.getClientRects()) keep.push([r.left - O.left - 3, r.top - O.top + 1, r.right - O.left + 3, r.bottom - O.top - 1]); }
  items.push(S.initial({ ch: 'B', G: { box: [x0, base - H, x0 + S.initial.width('B', face) * H, base] }, keep, big: true, level: LEVEL, seed: SEED, room: x0 - 10, bottom: O.height, face }));
  const al = row.querySelector('.alone').getBoundingClientRect(); let x = al.left - O.left;
  for (const ch of 'ADMST') { const w = S.initial.width(ch, face) * H;
    items.push(S.initial({ ch, G: { box: [x, base - H, x + w, base] }, keep: [], big: true, level: LEVEL, seed: SEED + ch.charCodeAt(0), room: H * .35, bottom: 1e9, face })); x += w + H * .55; }
}
const TC = performance.now() - Tc0; let TL = 0;
if (!supported()) document.body.dataset.timing = 'no webgl2';
else {
  const dpr = Math.min(2, devicePixelRatio || 1); bk.width = O.width * dpr; bk.height = O.height * dpr; bk.style.width = O.width + 'px'; bk.style.height = O.height + 'px';
  const g = bk.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const P = S.palette[dark ? 'dark' : 'light'], W = createWriter(sheet, g, { dpr, dark }); let t = 0;
  const Tl0 = performance.now();
  for (const { letter } of items) if (letter?.M) { if (letter.red) inkLetter(g, { ...letter, M: letter.red }, P.r, { dpr }); inkLetter(g, letter, P.k, { dpr }); }   // the red first, the black over it
  TL = performance.now() - Tl0;
  for (const { marks } of items) { let run = null; const flush = () => { if (run) { W.part(t, t + 1, run.strokes, P[run.col], { width: run.w, hair: run.hair }).done(); t += 1; } run = null; };
    for (const m of marks) { if (!run || run.col !== m.col || Math.abs(run.w - m.w) > .01 || Math.abs(run.hair - m.hair) > .01) { flush(); run = { col: m.col, w: m.w, hair: m.hair, strokes: [] }; }
      run.strokes.push({ pts: m.pts, angle: m.angle, press: m.press }); }
    flush(); }
  W.flush(); W.destroy?.(); document.body.dataset.timing = `drawn in ${Math.round(performance.now() - T0)} ms (fonts ${Math.round(TF)} ms, compose ${Math.round(TC)} ms, letters ${Math.round(TL)} ms)`;
}
</script>
</body>
</html>
